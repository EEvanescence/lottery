<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lottery</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("wheel_theme") || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
  <style>
    :root {
      --bg-main: #0d0e14;
      --bg-input: rgba(255, 255, 255, 0.06);
      --glass: rgba(28, 30, 40, 0.62);
      --glass-strong: rgba(20, 21, 29, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f8;
      --text-muted: #9aa0b4;
      --accent: #6366f1;
      --accent-hover: #4f52e0;
      --danger: #fca5a5;
      --glow-a: rgba(99, 102, 241, 0.2);
      --glow-b: rgba(236, 72, 153, 0.15);
      --dots: rgba(255, 255, 255, 0.045);
    }

    :root[data-theme="light"] {
      --bg-main: #eceef7;
      --bg-input: rgba(255, 255, 255, 0.85);
      --glass: rgba(255, 255, 255, 0.68);
      --glass-strong: rgba(255, 255, 255, 0.92);
      --border: rgba(20, 24, 50, 0.12);
      --text-main: #1b1d2e;
      --text-muted: #646a80;
      --danger: #dc2626;
      --glow-a: rgba(99, 102, 241, 0.22);
      --glow-b: rgba(236, 72, 153, 0.16);
      --dots: rgba(20, 24, 50, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Vazirmatn", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, var(--glow-a), transparent 45%),
        radial-gradient(circle at 88% 92%, var(--glow-b), transparent 45%),
        var(--bg-main);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--dots) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .brand-icon {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: conic-gradient(#6366f1, #ec4899, #f59e0b, #10b981, #06b6d4, #6366f1);
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.55);
      animation: rotate 9s linear infinite;
    }

    .brand-icon::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--bg-main);
    }

    @keyframes rotate { to { transform: rotate(360deg); } }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      align-items: center;
    }

    .wheel-stage {
      --glow: #6366f1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      user-select: none;
    }

    .wheel-stage::before {
      content: "";
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
      filter: blur(34px);
      opacity: 0.32;
      animation: breathe 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    .wheel-stage.spinning::before { opacity: 0.6; }

    @keyframes breathe {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.04); }
    }

    canvas#wheelCanvas {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.5));
    }

    .wheel-stage.spinning canvas#wheelCanvas { animation: jitter 0.09s linear infinite; }

    @keyframes jitter {
      0% { transform: translate(0.5px, 0); }
      50% { transform: translate(-0.5px, 0.4px); }
      100% { transform: translate(0.3px, -0.4px); }
    }

    .pointer {
      position: absolute;
      right: -12px;
      top: 50%;
      width: 46px;
      height: 42px;
      margin-top: -21px;
      transform-origin: 85% 50%;
      filter: drop-shadow(-3px 3px 5px rgba(0, 0, 0, 0.55));
      z-index: 10;
      pointer-events: none;
    }

    .spin-overlay {
      position: absolute;
      bottom: -14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }

    .spin-label {
      background: var(--glass-strong);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-main);
      padding: 7px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .spin-label.hidden { opacity: 0; transform: translateY(6px); }

    .panel {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      height: 500px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.12);
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .tab-btn:hover { color: var(--text-main); }

    .tab-btn.active {
      color: var(--text-main);
      border-bottom-color: var(--accent);
      background: linear-gradient(to top, rgba(99, 102, 241, 0.14), transparent);
    }

    .badge {
      background: var(--bg-input);
      color: var(--text-main);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
    }

    .tab-content {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow: hidden;
    }

    .tab-content.active { display: flex; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
    }

    .btn:active:not(:disabled) { transform: translateY(0); }

    .btn:focus-visible,
    .tab-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.5);
    }

    .btn-danger { color: var(--danger); }

    .btn-icon { padding: 8px; }

    :root[data-theme="dark"] .icon-moon { display: none; }
    :root[data-theme="light"] .icon-sun { display: none; }

    textarea#entriesInput {
      flex: 1;
      width: 100%;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.8;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea#entriesInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
    }

    .hint { font-size: 0.82rem; color: var(--text-muted); }

    .results-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      transition: border-color 0.15s, transform 0.15s;
    }

    .result-item:hover { border-color: rgba(99, 102, 241, 0.5); transform: translateX(-2px); }

    .result-rank { color: var(--text-muted); font-size: 0.8rem; }

    .empty-state {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .empty-state svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.6;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 12, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--glass-strong);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      animation: bounceIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5) translateY(30px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header {
      background: linear-gradient(135deg, #4f46e5, #c026d3);
      padding: 16px 20px;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      text-align: center;
    }

    .modal-body {
      padding: 26px 20px 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .trophy {
      width: 52px;
      height: 52px;
      fill: none;
      stroke: #facc15;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.7));
      animation: float 2.2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .winner-name {
      font-size: 2rem;
      font-weight: 800;
      color: #facc15;
      word-break: break-word;
      animation: shine 1.8s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 100% { text-shadow: 0 0 8px rgba(250, 204, 21, 0.35); }
      50% { text-shadow: 0 0 22px rgba(250, 204, 21, 0.9), 0 0 40px rgba(250, 204, 21, 0.4); }
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: rgba(0, 0, 0, 0.12);
    }

    canvas#confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }

    @media (max-width: 860px) {
      .container { grid-template-columns: 1fr; padding: 16px; }
      .wheel-stage { max-width: 340px; margin-bottom: 20px; }
      .panel { height: 400px; }
      header { padding: 10px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel-stage::before,
      .wheel-stage.spinning canvas#wheelCanvas,
      .brand-icon,
      .trophy,
      .winner-name { animation: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"></div>
      <span>گردونه قرعه‌کشی</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-icon" id="themeBtn" aria-label="تغییر تم">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn btn-primary" id="headerSpinBtn">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        بچرخون
      </button>
    </div>
  </header>

  <main class="container">
    <section class="wheel-stage" id="wheelStage">
      <svg class="pointer" id="pointer" viewBox="0 0 46 42">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fde68a"/>
            <stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <path d="M2 21 L31 4 Q44 7 44 21 Q44 35 31 38 Z" fill="url(#pg)" stroke="#7c4a03" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="35" cy="21" r="4.5" fill="#7c4a03"/>
      </svg>
      <canvas id="wheelCanvas" width="800" height="800"></canvas>
      <div class="spin-overlay">
        <div class="spin-label" id="spinLabel">برای چرخش کلیک کن</div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="entries">
          شرکت‌کننده‌ها <span class="badge" id="entriesCount">0</span>
        </button>
        <button class="tab-btn" data-tab="results">
          نتایج <span class="badge" id="resultsCount">0</span>
        </button>
      </div>

      <div class="tab-content active" id="tab-entries">
        <div class="toolbar">
          <button class="btn" id="shuffleBtn">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            بُر زدن
          </button>
          <button class="btn" id="sortBtn">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
            مرتب کردن
          </button>
          <button class="btn btn-danger" id="clearBtn">
            <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
            پاک کردن
          </button>
        </div>
        <textarea id="entriesInput" placeholder="نام هر شرکت‌کننده در یک خط"></textarea>
        <div class="hint">هر خط به عنوان یه بخش رو گردونه قرار می‌گیره.</div>
      </div>

      <div class="tab-content" id="tab-results">
        <div class="toolbar">
          <button class="btn btn-danger" id="clearResultsBtn">
            <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
            پاک کردن تاریخچه
          </button>
        </div>
        <div class="results-list" id="resultsList"></div>
      </div>
    </aside>
  </main>

  <div class="modal-backdrop" id="winnerModal">
    <div class="modal">
      <div class="modal-header">برنده خرشانس قرعه‌کشی مشخص شد 😬</div>
      <div class="modal-body">
        <svg class="trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        <div class="winner-name" id="winnerText"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="closeModalBtn">بستن</button>
        <button class="btn btn-danger" id="removeWinnerBtn">حذف برنده از لیست</button>
      </div>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    const PALETTE = [
      "#6366f1", "#ec4899", "#f59e0b", "#10b981",
      "#06b6d4", "#8b5cf6", "#ef4444", "#14b8a6",
      "#f97316", "#3b82f6"
    ];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("wheelStage");
    const pointer = document.getElementById("pointer");
    const entriesInput = document.getElementById("entriesInput");
    const entriesCount = document.getElementById("entriesCount");
    const resultsCount = document.getElementById("resultsCount");
    const resultsList = document.getElementById("resultsList");
    const spinLabel = document.getElementById("spinLabel");
    const winnerModal = document.getElementById("winnerModal");
    const winnerText = document.getElementById("winnerText");

    let entries = [];
    let results = [];
    let currentAngle = 0;
    let isSpinning = false;
    let lastWinnerIndex = -1;
    let highlightIndex = -1;
    let lastTickIndex = -1;
    let confettiFrame = 0;

    function secureRandom() {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] / (0xffffffff + 1);
    }

    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const f = v => Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt));
      return `rgb(${f(n >> 16)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`;
    }

    function colorFor(i, count) {
      let idx = i % PALETTE.length;
      if (i === count - 1 && count > 1 && idx === 0) idx = 1;
      return PALETTE[idx];
    }

    function indexAt(angle) {
      const n = entries.length || 1;
      const full = 2 * Math.PI;
      const a = (full - (((angle % full) + full) % full)) % full;
      return Math.floor(a / (full / n)) % n;
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem("wheel_theme", theme); } catch {}
    }

    function loadState() {
      const savedEntries = localStorage.getItem("wheel_entries");
      entriesInput.value = savedEntries !== null ? savedEntries : "";
      const savedResults = localStorage.getItem("wheel_results");
      if (savedResults) {
        try { results = JSON.parse(savedResults); } catch { results = []; }
      }
      syncEntries();
      renderResults();
    }

    function syncEntries() {
      localStorage.setItem("wheel_entries", entriesInput.value);
      entries = entriesInput.value
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0);
      entriesCount.textContent = entries.length;
      highlightIndex = -1;
    }

    function drawRing(center, radius, now) {
      const size = canvas.width;
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, "#2d3142");
      grad.addColorStop(0.5, "#0f1118");
      grad.addColorStop(1, "#2d3142");

      ctx.beginPath();
      ctx.arc(center, center, radius + 21, 0, 2 * Math.PI);
      ctx.lineWidth = 42;
      ctx.strokeStyle = grad;
      ctx.stroke();

      const bulbs = 28;
      const phase = Math.floor(now / (isSpinning ? 90 : 500));
      for (let i = 0; i < bulbs; i++) {
        const a = (i * 2 * Math.PI) / bulbs;
        const x = center + Math.cos(a) * (radius + 21);
        const y = center + Math.sin(a) * (radius + 21);
        const on = isSpinning ? (i + phase) % 3 === 0 : (i + phase) % 2 === 0;
        ctx.beginPath();
        ctx.arc(x, y, 6.5, 0, 2 * Math.PI);
        ctx.shadowColor = on ? "#facc15" : "transparent";
        ctx.shadowBlur = on ? 16 : 0;
        ctx.fillStyle = on ? "#fde68a" : "#3b3f52";
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.shadowColor = "transparent";
    }

    function drawHub(center) {
      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
      ctx.shadowBlur = 22;
      ctx.shadowOffsetY = 6;
      const hub = ctx.createRadialGradient(center - 14, center - 16, 4, center, center, 58);
      hub.addColorStop(0, "#ffffff");
      hub.addColorStop(1, "#cdd3e3");
      ctx.beginPath();
      ctx.arc(center, center, 58, 0, 2 * Math.PI);
      ctx.fillStyle = hub;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(center, center, 58, 0, 2 * Math.PI);
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#1c1e28";
      ctx.stroke();

      ctx.fillStyle = "#1c1e28";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '800 30px "Vazirmatn", system-ui, sans-serif';
      ctx.fillText("چرخ", center, center + 2);
    }

    function drawWheel() {
      const now = performance.now();
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 46;

      ctx.clearRect(0, 0, size, size);
      drawRing(center, radius, now);

      const items = entries.length > 0 ? entries : ["لیست خالیه"];
      const count = items.length;
      const arc = (2 * Math.PI) / count;
      const showHighlight = highlightIndex >= 0 && !isSpinning;

      for (let i = 0; i < count; i++) {
        const startAngle = currentAngle + i * arc;
        const endAngle = startAngle + arc;
        const base = entries.length > 0 ? colorFor(i, count) : "#2c303a";

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.closePath();

        const fill = ctx.createRadialGradient(center, center, radius * 0.18, center, center, radius);
        fill.addColorStop(0, shade(base, 0.3));
        fill.addColorStop(1, shade(base, -0.22));
        ctx.fillStyle = fill;
        ctx.fill();

        if (showHighlight && i !== highlightIndex) {
          ctx.fillStyle = "rgba(10, 11, 16, 0.55)";
          ctx.fill();
        }

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(13, 14, 20, 0.55)";
        ctx.stroke();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + arc / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = showHighlight && i !== highlightIndex ? "rgba(255, 255, 255, 0.6)" : "#ffffff";

        const fontSize = count > 20 ? 22 : count > 10 ? 30 : 42;
        ctx.font = `800 ${fontSize}px "Vazirmatn", system-ui, sans-serif`;
        ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
        ctx.shadowBlur = 5;

        let label = items[i];
        if (label.length > 15) label = label.slice(0, 14) + "…";
        ctx.fillText(label, radius - 34, 0);
        ctx.restore();
      }

      if (showHighlight) {
        const start = currentAngle + highlightIndex * arc;
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, start + arc);
        ctx.closePath();
        ctx.lineWidth = 7;
        ctx.lineJoin = "round";
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.65 + 0.35 * Math.sin(now / 220)})`;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
      ctx.stroke();

      drawHub(center);
    }

    function renderLoop() {
      drawWheel();
      requestAnimationFrame(renderLoop);
    }

    function tickPointer() {
      pointer.animate(
        [
          { transform: "rotate(0deg)" },
          { transform: "rotate(-16deg)", offset: 0.35 },
          { transform: "rotate(0deg)" }
        ],
        { duration: 110, easing: "ease-out" }
      );
    }

    function spin() {
      if (isSpinning || entries.length === 0) return;

      isSpinning = true;
      highlightIndex = -1;
      lastTickIndex = indexAt(currentAngle);
      stage.classList.add("spinning");
      spinLabel.classList.add("hidden");
      setControlsDisabled(true);

      const startAngle = currentAngle;
      const extraSpins = 6 + Math.floor(secureRandom() * 4);
      const randomOffset = secureRandom() * 2 * Math.PI;
      const targetAngle = startAngle + extraSpins * 2 * Math.PI + randomOffset;
      const duration = 4500;
      const startTime = performance.now();

      function easeOutQuint(t) {
        return 1 - Math.pow(1 - t, 5);
      }

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOutQuint(progress);

        const idx = indexAt(currentAngle);
        if (idx !== lastTickIndex) {
          lastTickIndex = idx;
          tickPointer();
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentAngle = currentAngle % (2 * Math.PI);
          isSpinning = false;
          stage.classList.remove("spinning");
          spinLabel.classList.remove("hidden");
          setControlsDisabled(false);
          announceWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    function announceWinner() {
      const winnerIndex = indexAt(currentAngle);
      const winner = entries[winnerIndex];

      lastWinnerIndex = winnerIndex;
      highlightIndex = winnerIndex;
      stage.style.setProperty("--glow", colorFor(winnerIndex, entries.length));
      results.unshift(winner);
      localStorage.setItem("wheel_results", JSON.stringify(results));
      renderResults();

      winnerText.textContent = winner;
      winnerModal.classList.add("open");
      launchConfetti();
    }

    function renderResults() {
      resultsCount.textContent = results.length;
      resultsList.innerHTML = "";
      if (results.length === 0) {
        resultsList.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>هنوز قرعه‌کشی انجام نشده. گردونه رو بچرخون!</span></div>';
        return;
      }
      results.forEach((name, idx) => {
        const item = document.createElement("div");
        item.className = "result-item";
        item.innerHTML = `<strong>${escapeHtml(name)}</strong><span class="result-rank">#${results.length - idx}</span>`;
        resultsList.appendChild(item);
      });
    }

    function setControlsDisabled(state) {
      entriesInput.disabled = state;
      document.getElementById("shuffleBtn").disabled = state;
      document.getElementById("sortBtn").disabled = state;
      document.getElementById("clearBtn").disabled = state;
      document.getElementById("headerSpinBtn").disabled = state;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function launchConfetti() {
      cancelAnimationFrame(confettiFrame);
      const cCanvas = document.getElementById("confettiCanvas");
      const cCtx = cCanvas.getContext("2d");
      cCanvas.width = window.innerWidth;
      cCanvas.height = window.innerHeight;

      const particles = [];
      function burst(fromLeft) {
        for (let i = 0; i < 80; i++) {
          const deg = fromLeft ? 30 + Math.random() * 45 : 105 + Math.random() * 45;
          const angle = (-deg * Math.PI) / 180;
          const speed = 14 + Math.random() * 14;
          particles.push({
            x: fromLeft ? 0 : cCanvas.width,
            y: cCanvas.height,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            w: 8 + Math.random() * 6,
            h: 5 + Math.random() * 6,
            round: Math.random() < 0.35,
            color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
            rot: Math.random() * 360,
            vRot: -10 + Math.random() * 20,
            life: 0,
            maxLife: 170 + Math.random() * 60
          });
        }
      }
      burst(true);
      burst(false);

      function updateConfetti() {
        cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        let alive = 0;
        particles.forEach(p => {
          if (p.life >= p.maxLife) return;
          alive++;
          p.life++;
          p.vx *= 0.985;
          p.vy = p.vy * 0.985 + 0.32;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;
          cCtx.save();
          cCtx.globalAlpha = Math.min(1, (p.maxLife - p.life) / 50);
          cCtx.translate(p.x, p.y);
          cCtx.rotate((p.rot * Math.PI) / 180);
          cCtx.fillStyle = p.color;
          if (p.round) {
            cCtx.beginPath();
            cCtx.arc(0, 0, p.w / 2.4, 0, 2 * Math.PI);
            cCtx.fill();
          } else {
            cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          }
          cCtx.restore();
        });
        if (alive > 0) {
          confettiFrame = requestAnimationFrame(updateConfetti);
        } else {
          cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        }
      }
      confettiFrame = requestAnimationFrame(updateConfetti);
    }

    canvas.addEventListener("click", spin);
    document.getElementById("headerSpinBtn").addEventListener("click", spin);
    entriesInput.addEventListener("input", syncEntries);

    document.getElementById("themeBtn").addEventListener("click", () => {
      setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    document.getElementById("shuffleBtn").addEventListener("click", () => {
      const arr = [...entries];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(secureRandom() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      entriesInput.value = arr.join("\n");
      syncEntries();
    });

    document.getElementById("sortBtn").addEventListener("click", () => {
      const arr = [...entries].sort((a, b) => a.localeCompare(b, "fa"));
      entriesInput.value = arr.join("\n");
      syncEntries();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      entriesInput.value = "";
      syncEntries();
    });

    document.getElementById("clearResultsBtn").addEventListener("click", () => {
      results = [];
      localStorage.removeItem("wheel_results");
      renderResults();
    });

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      winnerModal.classList.remove("open");
    });

    document.getElementById("removeWinnerBtn").addEventListener("click", () => {
      if (lastWinnerIndex >= 0 && lastWinnerIndex < entries.length) {
        entries.splice(lastWinnerIndex, 1);
        entriesInput.value = entries.join("\n");
        syncEntries();
      }
      winnerModal.classList.remove("open");
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.fonts.ready.then(() => {
      loadState();
      renderLoop();
    });
  </script>
</body>
</html>
